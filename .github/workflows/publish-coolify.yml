name: Publish to Coolify

# Deliberate production publishing, only from the reviewed primary branch.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coolify-production
  cancel-in-progress: false

jobs:
  quality:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/quality-gate.yml

  publish:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build the candidate without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: prompt-enhancer:candidate
          build-args: APP_REVISION=${{ github.sha }}
      - name: Check the actual container boundary
        env:
          DEPLOY_REVISION: ${{ github.sha }}
        run: python scripts/smoke_hosted_container.py
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          REVISION: ${{ github.sha }}
        run: |
          docker tag prompt-enhancer:candidate "$IMAGE:sha-$REVISION"
          docker tag prompt-enhancer:candidate "$IMAGE:production"
          docker push "$IMAGE:sha-$REVISION"
          docker push "$IMAGE:production"

  deploy:
    needs: publish
    # Set to a JSON array of private runner labels if the controller is LAN-only.
    runs-on: ${{ fromJSON(vars.COOLIFY_RUNNER_LABELS || '"ubuntu-latest"') }}
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Deploy and verify the published revision
        env:
          COOLIFY_WEBHOOK: ${{ vars.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_PUBLIC_URL: ${{ vars.COOLIFY_PUBLIC_URL }}
          COOLIFY_ACCESS_CLIENT_ID: ${{ secrets.COOLIFY_ACCESS_CLIENT_ID }}
          COOLIFY_ACCESS_CLIENT_SECRET: ${{ secrets.COOLIFY_ACCESS_CLIENT_SECRET }}
          PROMPT_ENHANCER_ACCESS_CLIENT_ID: ${{ secrets.PROMPT_ENHANCER_ACCESS_CLIENT_ID }}
          PROMPT_ENHANCER_ACCESS_CLIENT_SECRET: ${{ secrets.PROMPT_ENHANCER_ACCESS_CLIENT_SECRET }}
          DEPLOY_REVISION: ${{ github.sha }}
        run: python scripts/deploy_coolify.py
