name: Collaboration policy

# Metadata-only: runs the validator from the trusted base commit and never
# checks out or executes pull request head code. On a free private repository
# a branch can still edit this file; only enforced protections make it binding.
on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - ready_for_review

permissions:
  contents: read

jobs:
  collaboration-policy:
    name: Collaboration policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out base commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Validate pull request metadata
        run: python scripts/check_collaboration_policy.py --event-file "$GITHUB_EVENT_PATH"
