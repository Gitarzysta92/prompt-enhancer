[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-enhancer"
version = "0.1.0"
description = "Local-first, privacy-sensitive analytics for coding-agent workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=46,<51",
  "fastapi>=0.116.1,<1",
  "httpx>=0.28.1,<1",
  # MIT-licensed official MCP SDK. Keep the protocol/runtime revision exact;
  # Store host behavior is contract-tested against this release.
  "mcp==2.1.1",
  # Managed MCP calls validate the exact reviewed input/output contracts.
  "jsonschema>=4.26,<5",
  # Apache-2.0/BSD-2-Clause; runtime MCP package validation imports this directly.
  "packaging==26.3",
  "pydantic>=2.11.7,<3",
  "regex==2026.7.19",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "huggingface-hub>=0.36.2,<1",
  "pytest>=8.4.1,<9",
]
models = [
  "huggingface-hub>=0.36.2,<1",
  "safetensors>=0.8,<1",
  "sentencepiece>=0.2.2,<1",
  "torch>=2.8,<2.9",
  "transformers>=4.57.6,<5",
  "accelerate>=1.14,<2",
  "bitsandbytes>=0.50.1,<1",
]
desktop = [
  "pywebview>=6.2.1,<7",
]

[project.scripts]
prompt-enhancer = "prompt_enhancer.cli:main"

[project.gui-scripts]
prompt-enhancer-desktop = "prompt_enhancer.desktop_overlay:desktop_main"
prompt-enhancer-agent = "prompt_enhancer.desktop_overlay:agent_desktop_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prompt_enhancer = [
  "_resources/probes/*.py",
  "_resources/public/*.json",
  "_resources/public/*.txt",
  "_resources/dashboard/*",
  "_resources/dashboard/assets/*",
  "_resources/dashboard/**/*",
]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
